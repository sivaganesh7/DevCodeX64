[tool.poetry]
name = "DevCodeX64-ai-service"
version = "1.0.0"
description = "AI/ML service for DevCodeX64 platform"
authors = ["DevCodeX64 Team"]

[tool.poetry.dependencies]
python = "^3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
